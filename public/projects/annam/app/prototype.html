*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.stage{display:flex;gap:56px;justify-content:center;align-items:flex-start;max-width:1120px;margin:0 auto}

/* ---------- phone ---------- */
.phone{width:393px;max-width:100%;height:min(852px,calc(100dvh - 56px));min-height:640px;flex:none;
  background:var(--surface);border-radius:46px;border:10px solid #2B1918;position:relative;overflow:hidden;
  box-shadow:0 30px 60px -30px rgba(60,20,18,.45)}
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface);transition:background .6s ease}
.app.night{background:var(--night);color:var(--night-ink)}
.app.cam{background:var(--cam)}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 6px;font-size:13px;font-weight:600;color:var(--ox);flex:none;font-variant-numeric:tabular-nums}
.app.night .status,.app.cam .status{color:var(--night-ink)}
.status .isl{width:96px;height:26px;border-radius:20px;background:#2B1918}
.view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column}
.pad{padding:8px 24px 28px}
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--raise);padding:8px 8px 22px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;letter-spacing:.04em;color:var(--muted);padding:6px 0;position:relative}
.nav button[aria-current="page"]{color:var(--ox)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:-9px;width:22px;height:2px;border-radius:2px;background:var(--ox)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}

/* ---------- motion ---------- */
.in-fwd{animation:inR .34s cubic-bezier(.2,.7,.2,1) both}
.in-back{animation:inL .34s cubic-bezier(.2,.7,.2,1) both}
.in-fade{animation:fadeIn .3s ease both}
@keyframes inR{from{transform:translateX(26px);opacity:0}}
@keyframes inL{from{transform:translateX(-26px);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(8px)}}
.handoff{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:32px;
  background:var(--surface);animation:hand 2.4s ease both}
.handoff .dv{animation:rise 1.1s .15s cubic-bezier(.2,.7,.2,1) both}
@keyframes hand{0%{opacity:0}12%,82%{opacity:1}100%{opacity:0}}
@keyframes rise{from{transform:translateY(30px);opacity:0}}

/* ---------- type ---------- */
.serif{font-family:var(--serif)}
.logo{display:block;background:var(--logo) no-repeat center/contain;aspect-ratio:600/141;max-width:100%}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--ox);margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:32px} h2{font-size:25px} h3{font-size:18px}
.it{font-family:var(--serif);font-style:italic;color:var(--muted)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--gold-ink);font-weight:600}
.small{font-size:13px;color:var(--muted)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* ---------- controls ---------- */
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:1px solid var(--ox);color:var(--ox);
  border-radius:28px;padding:14px 26px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.fill{background:var(--ox);color:var(--on-ox)}
.btn.block{width:100%}
.btn.ghost{border-color:transparent;letter-spacing:.08em}
.btn.sm{padding:10px 16px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
.on-dark .btn{border-color:var(--night-ink);color:var(--night-ink)}
.link{color:var(--ox);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gold)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ox);font-size:14px;padding:6px 0 4px;align-self:flex-start}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.input{border:1px solid var(--line);background:var(--raise);border-radius:14px;padding:12px 14px;width:100%;min-width:0}
.input:focus{border-color:var(--ox);outline:none}
.inputwrap{position:relative}
.inputwrap .input{padding-right:54px}
.inputwrap .micbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--ox);color:var(--on-ox);display:grid;place-items:center}
.micbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.micbtn.on{animation:pulsebg 1s ease-in-out infinite}
@keyframes pulsebg{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--gold) 35%,transparent)}}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;background:var(--raise)}
.chip[aria-pressed="true"]{border-color:var(--ox);background:var(--ox);color:var(--on-ox)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:22px;padding:4px}
.seg button{padding:8px 6px;border-radius:18px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ox);font-weight:600;box-shadow:0 1px 2px rgba(60,20,18,.08)}
.toggle{width:44px;height:26px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--raise);transition:transform .2s}
.toggle[aria-checked="true"]{background:var(--ox)}
.toggle[aria-checked="true"]::after{transform:translateX(18px)}
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.progress i{height:3px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--ox)}

/* ---------- surfaces ---------- */
.card{background:var(--raise);border-radius:22px;padding:18px}
.card.line{background:transparent;border:1px solid var(--line)}
.card.hero{background:var(--ox);color:var(--on-ox);padding:22px}
.card.hero h2,.card.hero h3{color:var(--on-ox)}
.card.hero .eyebrow{color:var(--gold)}
.card.hero .small{color:var(--on-ox);opacity:.78}
.card.hero .btn{border-color:var(--on-ox);color:var(--on-ox)}
.card.hero .btn.fill{background:var(--on-ox);color:var(--ox)}
.rule{height:1px;background:var(--line);border:0;margin:0}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;width:100%;text-align:left}
.drop{display:inline-block;width:10px;height:13px;background:var(--gold);border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;transform:rotate(180deg);flex:none}
.drop.big{width:22px;height:29px}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:rotate(180deg) scale(1.35);opacity:.6}}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none;border:2px solid var(--raise)}
.av.lg{width:46px;height:46px;font-size:17px;border:0}
.avs{display:flex}.avs .av+.av{margin-left:-8px}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:12px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.live{background:var(--gold);color:#2B1918}
.pill.done{color:var(--ok)}
.quote{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.45;color:var(--ink)}
.quote.lg{font-size:21px;line-height:1.35}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -24px;padding:2px 24px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.rcard{flex:none;width:176px;text-align:left;background:var(--raise);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.plate{display:block;width:100%;aspect-ratio:1/1;max-width:100%;border-radius:16px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding:24px}
.foot{padding:16px 24px 26px;display:flex;flex-direction:column;gap:10px}
.timeline{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.timeline button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:4px 0}
.timeline button[aria-current="true"]{color:var(--ox);font-weight:600}
.sprout{width:26px;height:26px}
.group{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:6px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:36px 16px}
.empty p{max-width:30ch}
.banner{display:flex;gap:12px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 8%,var(--raise));border-radius:18px;padding:14px 16px}
.banner .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:7px;flex:none}
.toast{position:absolute;left:24px;right:24px;bottom:96px;background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 16px;font-size:14px;z-index:9;animation:fade .3s ease both;display:flex;gap:10px;align-items:center}
.sheet{position:absolute;inset:0;background:color-mix(in srgb,#1A0F0E 45%,transparent);z-index:8;display:flex;align-items:flex-end;animation:fadeIn .2s ease both}
.sheet>div{background:var(--surface);width:100%;max-height:88%;overflow:auto;border-radius:26px 26px 0 0;padding:18px 24px 30px;animation:up .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{transform:translateY(40px)}}

/* table-meal card: quote-led, no photo (Annam has no camera) */
.tm{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;background:var(--raise);border-radius:22px;padding:18px}
.tm .mark{font-family:var(--serif);font-size:44px;line-height:.6;color:var(--gold);height:18px}
.am{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--raise);border-radius:22px;padding:12px}
.am .thumb{width:76px;flex:none}

/* dinner mode */
.dinner{flex:1;display:flex;flex-direction:column;gap:20px;padding:12px 28px 28px;color:var(--night-ink)}
.dinner h1{color:var(--night-ink);font-size:38px}
.dinner .small,.dinner .it{color:var(--night-muted)}
.dinner .eyebrow{color:var(--gold)}
.dinner .card{background:color-mix(in srgb,var(--night-ink) 8%,transparent);color:var(--night-ink)}

/* device illustration */
.dv{display:block;height:auto;max-width:100%;overflow:visible}
.dv .dev{transform-box:view-box;transform-origin:60px 100px;transition:transform .9s cubic-bezier(.6,0,.3,1)}
.dv.inv .dev{transform:rotate(180deg)}
.dv.off{opacity:.45}
.dv.search .glow{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.15}50%{opacity:.9}}
.dv.hint .dev{animation:wob 2.6s ease-in-out infinite}
@keyframes wob{0%,60%,100%{transform:rotate(180deg)}70%{transform:rotate(172deg)}80%{transform:rotate(186deg)}90%{transform:rotate(178deg)}}
.dv.flipping .dev{animation:flipUp 1.2s cubic-bezier(.6,0,.3,1) both}
@keyframes flipUp{from{transform:rotate(180deg)}to{transform:rotate(0)}}
.dv.flipping .glow{animation:glowIn 1.4s 1.1s ease both}
.dv.breathe .glow{animation:slow 5s ease-in-out infinite}
@keyframes slow{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes glowIn{from{opacity:0}to{opacity:1}}
.devbtn{border-radius:50%;padding:2px}
.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.states>div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:16px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.states>div[aria-current="true"]{border-color:var(--ox);color:var(--ox);background:var(--raise)}
.step-now{font-family:var(--serif);font-size:22px;line-height:1.3}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}
.check.on{background:var(--ox);border-color:var(--ox);color:var(--on-ox)}
.page-book{background:var(--raise);border-radius:6px 22px 22px 6px;padding:28px 24px;min-height:400px;display:flex;flex-direction:column;gap:16px;
  box-shadow:-6px 0 0 -3px var(--line),-10px 0 0 -6px var(--line)}
.wave{display:flex;gap:3px;align-items:center;height:22px}
.wave i{width:3px;border-radius:2px;background:var(--ox);height:6px}
.wave.on i{animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}
@keyframes wv{50%{height:20px}}

/* camera + lock screen */
.viewfinder{position:relative;margin:0 20px;border-radius:24px;overflow:hidden;aspect-ratio:3/4}
.viewfinder .plate{border-radius:0}
.viewfinder .corners{position:absolute;inset:18px;border:1px dashed rgba(244,236,227,.35);border-radius:16px}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid #F4ECE3;display:grid;place-items:center}
.shutter i{width:56px;height:56px;border-radius:50%;background:#F4ECE3}
.lock{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 14px 24px;color:#F6EDE2;
  background:radial-gradient(120% 80% at 50% 0%,#5A2A26 0%,#2A1513 55%,#160B0A 100%)}
.lock .clock{font-family:var(--serif);font-size:76px;font-weight:300;text-align:center;line-height:1;margin-top:18px;font-variant-numeric:tabular-nums}
.notif{display:flex;gap:12px;text-align:left;width:100%;border-radius:20px;padding:12px 14px;background:rgba(246,237,226,.14);backdrop-filter:blur(10px);color:#F6EDE2}
.notif .ic{width:34px;height:34px;border-radius:9px;background:#6B2D2C;display:grid;place-items:center;flex:none}
.notif .ic .drop{width:10px;height:13px}

/* ---------- side panel ---------- */
.side{width:380px;max-width:100%;display:flex;flex-direction:column;gap:26px;padding-top:10px;min-width:0}
.side h1{font-size:40px}
.side .lede{color:var(--ink);max-width:40ch}
.ia{display:flex;flex-direction:column;gap:16px}
.ia .grp{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start}
.ia .grp>span{font-family:var(--serif);color:var(--ox);font-size:15px;padding-top:4px}
.ia .grp div{display:flex;flex-wrap:wrap;gap:6px}
.ia button{font-size:12.5px;padding:5px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.ia button[aria-current="true"]{border-color:var(--ox);color:var(--ox);font-weight:600}
.demo{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:14px}
.demo .seg{background:var(--surface)}
.demo .seg button[aria-pressed="true"]{background:var(--ox);color:var(--on-ox)}
.note{font-size:12.5px;color:var(--muted);max-width:44ch}
@media (max-width:860px){ .stage{flex-direction:column;align-items:center;gap:36px} .side{width:100%;max-width:440px} }
@media (max-width:440px){ body{padding-block:12px} .phone{border-width:6px;border-radius:34px;height:min(780px,calc(100dvh - 24px))} }
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function sprout(stage,on){

  let s=`<svg class="sprout" viewBox="0 0 26 26" fill="none" stroke="${c}" stroke-width="1.4" stroke-linecap="round"><path d="M4 22h18" opacity=".5"/>`;
  if(stage<=1) s+=`<ellipse cx="13" cy="19.5" rx="3.2" ry="2.2" fill="${on?'var(--gold)':'none'}"/>`;
  else{ const h=Math.min(4+stage*2.2,17); s+=`<path d="M13 22V${22-h}"/>`;
    if(stage>=3) s+=`<path d="M13 ${22-h*0.55}c-3-.2-5-1.8-5.6-4.2 3 .1 5 1.6 5.6 4.2z" fill="${stage>=5?'var(--gold)':'none'}"/>`;
    if(stage>=4) s+=`<path d="M13 ${22-h*0.75}c3-.2 5-1.8 5.6-4.2-3 .1-5 1.6-5.6 4.2z" fill="${stage>=6?'var(--gold)':'none'}"/>`;

}

   Drawn from the built prototype: fluted translucent shade, scalloped rim, hammered brass band,

let _aid=0;
function annam(state='awake',w=120,cls=''){
  const i='a'+(++_aid), dock=state==='dock'||state==='muted', off=state==='offline';
  const lit=!(state==='rest'||off), g=state==='muted'?.28:1;
  const shade='M18,16 C28,62 34,96 36,130 L84,130 C86,96 92,62 102,16 Z';
  let fl='';for(let k=1;k<10;k++){const t=k/10;fl+=`<path d="M${(18+84*t).toFixed(1)},17 Q${(31+58*t).toFixed(1)},84 ${(36+48*t).toFixed(1)},129"/>`}
  let rim='M18,16';for(let x=18;x<102;x+=6)rim+=' a3,3 0 0 1 6,0';
  const dev=`<g class="dev">
    <path d="${shade}" fill="var(--shade)"/>
    <g class="glow" style="opacity:${lit?g:0}"><path d="${shade}" fill="url(#l${i})"/></g>
    <g stroke="var(--flute)" stroke-width="1" fill="none" opacity=".9">${fl}</g>
    <path d="${shade}" fill="none" stroke="var(--flute)" stroke-width="1.2"/>
    <path d="${rim}" fill="none" stroke="var(--flute)" stroke-width="1.2"/>
    <rect x="33.5" y="129" width="53" height="8" rx="1.5" fill="var(--gold)"/>
    <path d="M36,132 l6,1 l7,-1 l8,1.5 l9,-1 l8,1 l9,-1" stroke="#fff" stroke-opacity=".35" fill="none" stroke-width=".8"/>
    <rect x="36" y="137" width="48" height="9" rx="2" fill="var(--wood)"/>
    <rect x="30" y="145" width="60" height="7" rx="3.5" fill="var(--wood-hi)"/>
    <rect x="33" y="151" width="54" height="30" rx="3" fill="var(--wood)"/>
    <rect x="31" y="179" width="58" height="6" rx="3" fill="var(--wood-hi)"/>
    <circle cx="45" cy="166" r="3.4" fill="var(--wood-hi)" stroke="var(--wood)" stroke-width="1"/>
  </g>`;
  const defs=`<defs><radialGradient id="l${i}" cx=".5" cy=".62" r=".7"><stop offset="0" stop-color="#FFF7E2"/><stop offset=".55" stop-color="#F6E3B3"/><stop offset="1" stop-color="#E9C77C"/></radialGradient>
    <radialGradient id="h${i}"><stop offset="0" stop-color="var(--gold)" stop-opacity=".55"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></radialGradient></defs>`;
  const halo=`<g class="glow" style="opacity:${lit?g:0}"><ellipse cx="60" cy="74" rx="62" ry="72" fill="url(#h${i})"/></g>`;
  const label={awake:'Annam, upright and glowing',rest:'Annam, upside down and resting',offline:'Annam, offline',search:'Annam, glowing softly while pairing',dock:'Annam on its kitchen dock, glowing',muted:'Annam on its kitchen dock, muted'}[state];
  if(!dock) return `<svg class="dv ${state==='rest'||off?'inv':''} ${off?'off':''} ${state==='search'?'search':''} ${cls}" viewBox="-4 -4 128 208" width="${w}" role="img" aria-label="${label}">${defs}${halo}${dev}</svg>`;
  return `<svg class="dv ${cls}" viewBox="-6 -4 172 232" width="${w}" role="img" aria-label="${label}">${defs}
    <rect x="22" y="112" width="116" height="80" rx="7" fill="var(--oak-lo)"/>
    <g transform="translate(20,0)">${halo}${dev}</g>
    <path d="M10,168 h140 v28 a6,6 0 0 1 -6,6 h-128 a6,6 0 0 1 -6,-6z" fill="var(--oak)"/>
    <path d="M10,168 h140" stroke="var(--oak-lo)" stroke-width="2"/>
    <circle cx="80" cy="190" r="2.2" fill="${state==='muted'?'#C9A23A':'#7BC46A'}"/>
    <path d="M70,202 C64,212 92,214 120,226" stroke="var(--cord)" stroke-width="3" fill="none" stroke-dasharray="3 2"/></svg>`;
}

function enter(s){
  if(s==='seeds-gen' && !S.seeds.gen){ S.seeds.loading=true; setTimeout(()=>{S.seeds.gen=seedsFor(S.seeds.dish||'rasam'); S.seeds.loading=false; S.seeds.picked=[]; if(S.screen==='seeds-gen') render();},1500); }
  if(s==='log-process'){ setTimeout(()=>{ if(S.screen==='log-process'){ S.log.items=['Masala dosa','Coconut chutney','Sambar']; S.screen='log-identify'; S.dir='fade'; render(true); }},2200); }
  if(s==='ob-pair' && S.ob.pair==='idle'){ S.ob.pair='searching'; setTimeout(()=>{S.ob.pair='found'; if(S.screen==='ob-pair') render();},1400); }
  if(s==='capture'){ S.cap.lines=0; clearInterval(enter._ci); enter._ci=setInterval(()=>{ if(S.screen!=='capture'||S.cap.lines>=CAPLINES.length){clearInterval(enter._ci);return} S.cap.lines++; render(); },1700); }
}

}
function dinnerMode(){const p=S.seeds.planted, w=S.firstWeek?WEEK[S.day-1]:null;

  <div class="card stack" style="gap:6px">${w?`<span class="eyebrow">Day ${S.day} · ${w.t}</span><p>${esc(w.d)}</p>`:p?`<span class="eyebrow">${p.list.length} seed${p.list.length>1?'s':''} planted</span><p>Annam will choose its moment, or none at all.</p>`:`<span class="eyebrow">No seeds tonight</span><p>Annam will listen, and maybe wonder about something once.</p>`}</div>

V.kitchen=()=>`<div class="pad stack" style="gap:18px">${back_()}<span class="eyebrow">Kitchen · Today, 4:08 pm</span>
  <h2>At the stove</h2><p class="small">What you talked about while cooking, and what Annam is carrying to dinner.</p>
  <div class="stack" style="gap:12px">
   ${[['priya','How long do I boil the tamarind for rasam? Amma never told me.'],['annam','Usually eight to ten minutes, until the raw smell is gone. Was your Amma\'s rasam sour or mellow?'],['priya','Very sour. Aarav hates that, he always adds rice.'],['annam','I\'ll keep that in mind tonight.']].map(([w,t])=>w==='annam'?`<div class="row" style="align-items:flex-start;gap:10px"><span class="drop" style="margin-top:6px"></span><p class="quote" style="font-size:15px">${esc(t)}</p></div>`:`<div class="row" style="justify-content:flex-end"><p class="card" style="padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:80%">${esc(t)}</p></div>`).join('')}</div>

  <button class="btn fill block" data-act="seeds-from-kitchen">See seed ideas from this</button></div>`;

/* ================= SEEDS (two screens) ================= */

  ${S.seeds.listening?'<p class="small">Listening…</p>':''}
  <div class="chips">${['Khichdi','Paneer butter masala','Dosa'].map(x=>`<button class="chip" data-act="dish-pick" data-v="${x}" aria-pressed="${S.seeds.dish===x}">${x}</button>`).join('')}</div>
  <div class="field"><span class="label">Eating together</span><div class="chips">${S.family.map(f=>`<button class="chip" data-act="who-toggle" data-id="${f.id}" aria-pressed="${S.seeds.who.includes(f.id)}">${esc(f.name)}</button>`).join('')}</div></div>

V['seeds-gen']=()=>{const g=S.seeds.gen;
  if(S.seeds.loading||!g) return `<div class="center"><span class="drop big pulse"></span><p class="it" style="font-size:18px">Thinking about ${esc(short(S.seeds.dish||'tonight\'s dinner').toLowerCase())}…</p></div>`;
  const n=S.seeds.picked.length;

  <div class="stack" style="gap:6px"><span class="eyebrow">${esc(S.seeds.dish)}</span><h2>Keep the ones that feel right.</h2><p class="small">Annam waits for a natural moment and uses one. The rest stay unused.</p></div>
  <div class="stack" style="gap:10px">${g.map((s,i)=>{const on=S.seeds.picked.includes(i);return `<button class="card fade row" style="align-items:flex-start;gap:12px;animation-delay:${i*0.1}s;border:1px solid ${on?'var(--ox)':'transparent'};text-align:left;width:100%" data-act="seed-heart" data-i="${i}" aria-pressed="${on}">
    <div class="grow stack" style="gap:6px"><span class="tag">${s[0]}</span><p class="serif" style="font-size:17px;line-height:1.35;color:var(--ink)">${esc(s[1])}</p></div>

  <button class="btn fill block" data-act="plant">${n?`Plant ${n} seed${n>1?'s':''}`:'Let Annam choose from all'}</button>

/* ================= KITCHEN COMPANION ================= */
const R=id=>RECIPES.find(r=>r.id===id)||RECIPES[0];
const fmt=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const timerHTML=t=>`<span data-timer="${t.id}">${fmt((t.end-Date.now())/1000)}</span>`;
function kitchenHome(){const r=R(S.cook.r),t=S.timers[0],rs=recipes();
  return `<div class="pad stack" style="gap:20px;padding-top:14px">
  <div class="row between" style="align-items:flex-end"><div class="stack" style="gap:4px"><span class="eyebrow">Kitchen companion</span><h1 style="font-size:30px">In the kitchen</h1>
    <p class="small" style="max-width:24ch">${S.muted?'Muted. Press the button on Annam to listen again.':'Listening. Say "Annam" and ask anything.'}</p></div>
    <button data-act="mute" aria-label="${S.muted?'Unmute Annam':'Mute Annam'}">${annam(S.muted?'muted':'dock',92)}</button></div>
  <button class="card hero stack" style="gap:12px;text-align:left;width:100%" data-go="cook">
    <div class="row between"><span class="eyebrow">Cooking now</span><span class="pill live">${t?`${esc(t.label)} · ${timerHTML(t)}`:'No timers'}</span></div>
    <h2>${esc(r.name)}</h2><p class="small">Step ${S.cook.step+1} of ${r.steps.length} · ${esc(r.steps[S.cook.step][0])}</p></button>
  <div class="card stack" style="gap:10px"><h3>Cooking something you were taught?</h3>
    <p class="small">Talk Annam through it as you go. It writes it down in your words, with who it came from.</p>
    <button class="btn sm" style="align-self:flex-start" data-act="cap-start">${micSvg} Capture a family recipe</button></div>
  <button class="li" style="border-top:1px solid var(--line);border-bottom:1px solid var(--line)" data-act="seeds-from-kitchen"><span class="grow"><span class="small">Carried to the table tonight</span><br><span style="color:var(--ink)">Rasam and beans poriyal. Aarav softens it with rice.</span></span>${ICON.chev}</button>
  <div class="stack" style="gap:10px"><div class="row between"><h3>Family recipes</h3>${rs.length?`<button class="link small" data-act="journal-tab" data-k="recipes">All</button>`:''}</div>
    ${rs.length?`<div class="hscroll">${rs.map(x=>`<button class="rcard" data-act="open-recipe" data-id="${x.id}"><span class="tag">From ${esc(x.from.split(',')[0])}</span><span class="serif" style="font-size:18px;color:var(--ox);line-height:1.2">${esc(x.name)}</span><span class="small" style="margin-top:auto">${x.steps.length} steps · told by ${P(x.told).name}</span></button>`).join('')}</div>`
     :`<p class="small">None yet. The first one you capture lives here, and in your Journal.</p>`}</div>
  <p class="small">Lift Annam off the dock and it goes back to being a quiet guest at the table.</p></div>`}
V.cook=()=>{const r=R(S.cook.r),i=S.cook.step,st=r.steps[i];
  return `<div class="pad stack" style="gap:18px">${back_()}
  <div class="row between" style="align-items:flex-end"><div class="grow"><span class="eyebrow">Cook-along</span><h2 style="margin-top:4px">${esc(r.name)}</h2><p class="small">From ${esc(r.from)}</p></div>${annam(S.muted?'muted':'dock',58)}</div>
  <div class="card hero stack" style="gap:12px"><span class="eyebrow">Step ${i+1} of ${r.steps.length}</span><p class="step-now fade" key="s${i}">${esc(st[0])}</p>
    ${st[1]?`<button class="btn sm" style="align-self:flex-start" data-act="timer-add" data-m="${st[1]}">Set a ${st[1]} minute timer</button>`:''}</div>
  <div class="row between"><button class="btn sm" data-act="step" data-d="-1" ${i===0?'disabled':''}>Back</button><button class="btn fill sm" data-act="step" data-d="1" ${i>=r.steps.length-1?'disabled':''}>Next step</button></div>
  ${S.timers.length?`<div class="stack" style="gap:8px"><h3>Timers</h3>${S.timers.map(t=>`<div class="card row between" style="padding:12px 16px"><span>${esc(t.label)}</span><span class="serif" style="font-size:20px;color:var(--ox);font-variant-numeric:tabular-nums">${timerHTML(t)}</span></div>`).join('')}</div>`:''}
  <div class="stack" style="gap:8px"><span class="label">Hands busy? Just say</span><div class="chips">${['"Next step"','"Say that again"','"Timer for 5 minutes"','"What can I use instead?"'].map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>
  <div class="card line stack" style="gap:6px"><span class="eyebrow">If you run out</span><p>${esc(r.sub)}</p></div>
  <div class="stack" style="gap:2px"><h3>All steps</h3><div class="list">${r.steps.map((s,k)=>`<button class="li" data-act="step-to" data-i="${k}"><span class="check ${k<i?'on':''}">${k<i?ICON.check:k+1}</span><span class="grow" style="${k===i?'color:var(--ox);font-weight:500':k<i?'color:var(--muted)':''}">${esc(s[0])}</span></button>`).join('')}</div></div>
  <div class="stack" style="gap:6px"><h3>You'll need</h3><div class="list">${r.ing.map(x=>`<div class="li" style="padding:10px 0">${esc(x)}</div>`).join('')}</div></div></div>`};
V.capture=()=>{const n=S.cap.lines,done=n>=CAPLINES.length;
  return `<div class="pad stack" style="flex:1;gap:18px">${back_('Cancel')}
  <div class="row" style="gap:14px">${annam('dock',64)}<div><span class="eyebrow">Capturing a family recipe</span><h2 style="margin-top:4px">Tell Annam how it's made.</h2></div></div>
  <p class="small">Cook as you normally would and talk as you go. Annam listens for steps, amounts and the little rules.</p>
  <div class="stack" style="gap:10px">${CAPLINES.slice(0,n).map((l,k)=>`<p class="quote fade" style="font-size:16px;${k===n-1?'':'opacity:.65'}">"${esc(l)}"</p>`).join('')}

  <div style="margin-top:auto"><button class="btn fill block" data-go="capture-review" ${n<2?'disabled':''}>I'm done, write it down</button></div></div>`};
V['capture-review']=()=>{const c=CAPRECIPE;return `<div class="pad stack" style="gap:18px">${back_()}<span class="eyebrow">Here's what Annam wrote down</span>

V.recipe=()=>{const r=R(S.recipeId);return `<div class="pad stack" style="gap:18px">${back_()}
  <div><span class="tag">From ${esc(r.from)}</span><h1 style="font-size:32px;margin-top:6px">${esc(r.name)}</h1><p class="small">Told by ${P(r.told).name} in the kitchen, ${r.date}</p></div>

  <div class="card line stack" style="gap:6px"><span class="eyebrow">At the table</span><p>Annam might ask Aarav who first made this in your family. The answer is yours to tell.</p></div></div>`};

/* ================= JOURNAL (Meals · Recipes · Memory Book) ================= */
function tableCard(m){const mo=m.moments[0];return `<button class="tm" data-act="open-meal" data-id="${m.id}">
  <div class="row between"><span class="tag">At the table · ${m.date.replace(',','')}</span>${m.book?'<span class="drop" title="In the Memory Book"></span>':''}</div>
  ${mo?`<p class="quote" style="font-size:19px;line-height:1.38">"${esc(mo.text)}"</p>`:''}
  <div class="row between"><span class="small">${mo?esc(P(mo.by).name)+', over ':''}${esc(m.dish.toLowerCase())}</span>${avs(m.who)}</div></button>`}
function awayCard(m){return `<button class="am" data-act="open-meal" data-id="${m.id}"><div class="thumb">${plate(m.pal,m.dish)}</div>
  <div class="grow stack" style="gap:4px"><span class="tag">Away · ${m.date.replace(',','')}</span><span class="serif" style="font-size:17px;color:var(--ox);line-height:1.2">${esc(m.dish)}</span>${m.note?`<span class="small">${esc(m.note)}</span>`:''}</div></button>`}
function mealsTab(){const all=meals().filter(m=>S.jFilter==='all'||m.src===S.jFilter);
  if(!meals().length) return `<div class="empty">${annam('rest',44)}<h3>Nothing here yet</h3><p class="small">After dinner, Annam saves what was eaten and a line or two worth keeping. Eating out? Add a photo.</p><button class="btn sm" data-act="log-start">${ICON.cam} Add a photo</button></div>`;
  const groups=['Today','This week','Last week'];let out='',obsDone=false;
  for(const gname of groups){const g=all.filter(m=>m.wk===gname); if(!g.length) continue;
    out+=`<p class="group">${gname}</p>${g.map(m=>m.src==='table'?tableCard(m):awayCard(m)).join('')}`;
    if(!obsDone&&!S.fresh&&gname==='This week'){obsDone=true;out+=`<div class="card line stack" style="gap:6px"><span class="eyebrow">Annam noticed</span><p class="serif" style="font-size:17px;line-height:1.35">${esc(OBS[1].text)}</p><span class="small">${OBS[1].meta}</span></div>`}}
  return `<div class="chips">${[['all','All'],['table','At the table'],['away','Away']].map(([k,l])=>`<button class="chip" data-act="jfilter" data-k="${k}" aria-pressed="${S.jFilter===k}">${l}</button>`).join('')}</div>${out||'<p class="small">No meals in this filter.</p>'}`}
function recipesTab(){const rs=recipes();
  if(!rs.length) return `<div class="empty">${annam('dock',70)}<h3>No family recipes yet</h3><p class="small">Put Annam on its kitchen dock and talk it through something you were taught to cook.</p></div>`;
  return `<p class="small">Told out loud in your kitchen, kept with the person they came from.</p>${rs.map(x=>`<button class="card stack" style="gap:6px;text-align:left;width:100%" data-act="open-recipe" data-id="${x.id}">
    <span class="tag">From ${esc(x.from)}</span><span class="serif" style="font-size:20px;color:var(--ox)">${esc(x.name)}</span>
    <p class="quote" style="font-size:14.5px">"${esc(x.quote)}"</p><span class="small">Told by ${P(x.told).name} · ${x.date} · ${x.steps.length} steps</span></button>`).join('')}`}
function bookPages(){const ps=[{first:true},...meals().filter(m=>m.book)];return S.bookWho==='all'?ps:ps.filter(p=>p.first||p.moments.some(x=>x.by===S.bookWho))}
function bookTab(){
  if(S.fresh) return `<div class="empty"><span class="drop big"></span><h3>Your Memory Book begins after your first week</h3><p class="small">The best moments from the table collect here, one page each, for you to look back on years from now.</p></div>`;
  const ps=bookPages(),i=Math.min(S.bookPage,ps.length-1),p=ps[i];
  const body=p.first?`<span class="eyebrow">Chapter one</span><h1 style="font-size:32px">Our first week with Annam</h1><p class="it">Tue 3 Nov to Mon 9 Nov</p>
    <div class="stack" style="gap:12px;margin-top:6px">${WEEK.slice(0,2).map(w=>`<div><span class="small">${w.t}</span><p class="quote" style="font-size:15px">"${esc(w.a.text)}"</p></div>`).join('')}</div>`
   :`<span class="eyebrow">${p.date}</span><h2>${esc(p.dish)}</h2>${p.moments[0]?`<p class="quote lg">"${esc(p.moments[0].text)}"</p><span class="small">${P(p.moments[0].by).name}</span>`:''}${p.note?`<p class="small">${esc(p.note)}</p>`:''}`;
  return `<div class="chips">${[['all','Everyone'],...S.family.filter(f=>f.role==='Child').map(f=>[f.id,f.name])].map(([k,l])=>`<button class="chip" data-act="book-who" data-k="${k}" aria-pressed="${S.bookWho===k}">${esc(l)}</button>`).join('')}</div>
  <div class="page-book in-fade" key="b${i}${S.bookWho}">${body}<span class="small" style="margin-top:auto;text-align:right">${i+1} of ${ps.length}</span></div>
  <div class="row between"><button class="btn sm" data-act="book-prev" ${i===0?'disabled':''}>Previous</button><button class="btn sm" data-act="book-next" ${i>=ps.length-1?'disabled':''}>Next page</button></div>`}
V.journal=()=>`<div class="pad stack" style="gap:16px;padding-top:14px"><div class="row between"><h1 style="font-size:30px">Journal</h1>

  app.className='app'+(night?' night':'')+(cam?' cam':'');

  app.innerHTML=`<div class="status"><span>${time}</span><span class="isl"></span><span>●●● ▮</span></div>
   <div class="view"><div class="screen ${dir?'in-'+dir:''}">${(V[s]||V.home)()}</div></div>
   ${showNav?`<nav class="nav">${TABS.map(t=>{const k=t==='home'&&S.place==='dock';return `<button data-act="tab" data-t="${t}" aria-current="${TAB_OF[s]===t?'page':'false'}">${k?ICON.pot:ICON[t]}${k?'Kitchen':t[0].toUpperCase()+t.slice(1)}</button>`}).join('')}</nav>`:''}
   ${night?`<nav class="nav" style="background:transparent;border-color:color-mix(in srgb,var(--night-ink) 15%,transparent)">${TABS.map(t=>`<button data-act="tab" data-t="${t}" style="color:var(--night-muted)" aria-current="${t==='home'?'page':'false'}">${ICON[t]}${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</nav>`:''}
   ${S.toast?`<div class="toast" role="status"><span class="drop"></span>${esc(S.toast)}</div>`:''}
   ${S.handoff?`<div class="handoff" aria-live="polite">${S.handoff==='dock'?annam('dock',150):annam('awake',110,'breathe')}<h2>${S.handoff==='dock'?'Annam is in the kitchen.':'Annam is back at the table.'}</h2><p class="small" style="max-width:26ch">${S.handoff==='dock'?'It is your kitchen companion now. Cook, ask, or tell it a family recipe.':'A quiet guest again. Flip it upright when everyone sits down.'}</p></div>`:''}`;
  app.querySelector('.view').scrollTop=top;
  renderSide();
}
setInterval(()=>{ document.querySelectorAll('[data-timer]').forEach(el=>{const t=S.timers.find(x=>x.id===el.dataset.timer); if(t){const s=(t.end-Date.now())/1000; el.textContent=s>0?fmt(s):'Done'}}) },1000);
function toast(msg){ S.toast=msg; clearTimeout(toast._t); toast._t=setTimeout(()=>{S.toast=null; render()},2600); }
function handoff(kind){ S.handoff=kind; clearTimeout(handoff._t); handoff._t=setTimeout(()=>{S.handoff=null; render()},2400); }

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const sheetBg=e.target.closest('[data-act="search-close-bg"]'); if(sheetBg && !e.target.closest('[data-stop]')){S.search=false;render();return;}
  const j=e.target.closest('[data-jump]'); if(j){ jump(j.dataset.jump); return; }
  const el=e.target.closest('[data-act],[data-go]'); if(!el) return;
  const a=el.dataset.act, d=el.dataset;
  if(a && ACT[a]){ ACT[a](d,el); return; }
  if(d.go) go(d.go);
});
document.addEventListener('input',e=>{
  const t=e.target, m=t.dataset.model;
  if(t.dataset.fam!==undefined){ const f=S.family[+t.dataset.fam]; f[t.dataset.k]=t.dataset.k==='age'?t.value.replace(/\D/g,''):t.value; if(t.dataset.k==='name') f.call=t.value; return; }
  if(t.dataset.mealNote){ const mm=S.meals.find(x=>x.id===t.dataset.mealNote); if(mm) mm.note=t.value; return; }
  if(m==='dish') S.seeds.dish=t.value; if(m==='special') S.seeds.special=t.value;
  if(m==='lnote') S.log.note=t.value;
  if(m==='pname') S.newP.name=t.value; if(m==='page') S.newP.age=t.value.replace(/\D/g,'');
  if(m==='q'){ S.q=t.value; const r=document.getElementById('qres'); if(r) r.innerHTML=searchResults(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.search){S.search=false;render();} if(e.key==='Enter'&&e.target.id==='additem'){ACT['item-add']();} });

function jump(id){
  if(id==='search'){ S.prev=[]; S.screen='journal'; S.search=true; S.dir='fade'; render(true); return; }
  if(id==='j-meals'||id==='j-recipes'||id==='j-book'){ S.jtab=id.slice(2); root('journal'); return; }
  if(id==='j-dinner'){ S.tod='evening'; if(S.place!=='table'){S.place='table';S.muted=false} root('home'); return; }
  if(id==='k-home'){ S.place='dock'; root('home'); return; }
  if(id==='home'){ if(S.place==='dock') S.place='rest'; if(dinnerOn()) S.tod='afternoon'; }
  if(id==='ob-pair') S.ob.pair='idle';
  if(id==='ob-flip') S.ob.flip='rest';
  if(id==='ob-intro') S.ob.panel=0;
  if(['cook','capture','capture-review'].includes(id)) S.place='dock';
  if(id==='seeds-gen'&&!S.seeds.dish) S.seeds.dish='Rasam and beans poriyal';
  if(id==='log-identify'&&!S.log.items.length) S.log.items=['Masala dosa','Coconut chutney','Sambar'];
  if(id==='log-saved'&&!S.meals[0].id.startsWith('n')){ S.log.items=['Masala dosa','Coconut chutney','Sambar']; saveLog(); }
  if(id==='meal'){ const t=meals().find(m=>m.src==='table'); S.mealId=t?t.id:S.meals[0].id; }
  if(id==='recipe') S.recipeId=recipes()[0]?.id||'r1';
  root(id);
}
function saveLog(){
  const dish=S.log.items.join(', ')||'Masala dosa';
  S.meals.unshift({id:'n'+Date.now(),dish,date:'Thu, 5 Nov',time:'1:35 pm',wk:'Today',src:'away',pal:'dosa',who:S.log.who.slice(),moments:[],seeds:[],used:null,note:S.log.note,book:false});
}
const ACT={
 back:()=>back(), noop:()=>{},
 tab:d=>{ if(d.t==='journal') S.jtab=S.jtab||'meals'; root(d.t) },
 'ob-start':()=>{ S.ob.panel=0; go('ob-intro') },
 'intro-next':()=>{ if(S.ob.panel<1){S.ob.panel++;S.dir='fwd';render(true)} else go('ob-pair') },
 'intro-prev':()=>{ S.ob.panel=0; S.dir='back'; render(true) },
 'pair-connect':()=>{ S.ob.pair='connecting'; render(); setTimeout(()=>{S.ob.pair='done'; if(S.screen==='ob-pair') render()},1500) },
 'voice-pick':d=>{ S.ob.voice=d.id; render() },
 'voice-play':d=>{ S.ob.voice=d.id; S.ob.playing=d.id; render(); clearTimeout(ACT._vt); ACT._vt=setTimeout(()=>{S.ob.playing=null; if(['ob-voice'].includes(S.screen)) render()},4200) },
 'voice-next':()=>{ if(S.prev.at(-1)==='annam'){ toast('Voice changed to '+VOICES.find(v=>v.id===S.ob.voice).name); back(); } else go('ob-family') },
 'fam-add':()=>{ const id='p'+Date.now(); TINT[id]='#8C6A5A'; S.family.push({id,name:'',age:'',role:'Child',call:''}); render(); const ins=app.querySelectorAll('[data-k="name"]'); ins[ins.length-1]?.focus() },
 consent:d=>{ S.ob.consent[d.k]=!S.ob.consent[d.k]; render() },
 notif:d=>{ S.notif[d.k]=!S.notif[d.k]; render() },
 'notif-open':d=>{ if(d.to==='seeds-from-kitchen'){ S.tod='afternoon'; S.place=S.place==='offline'?'rest':S.place; ACT['seeds-from-kitchen'](); return; }
   if(d.to==='n-meal'){ S.prev=['home']; S.mealId='m1'; S.screen='meal'; S.dir='fwd'; render(true); return; }
   S.tod='morning'; S.firstWeek=false; if(S.place==='dock')S.place='rest'; root('home') },
 'week-begin':()=>{ S.firstWeek=true; S.day=1; S.viewDay=1; S.ob.flip='rest'; go('ob-flip') },
 'week-skip':()=>{ S.firstWeek=false; S.ob.flip='rest'; go('ob-flip') },
 'ob-wake':()=>{ if(S.ob.flip!=='rest') return; S.ob.flip='flipping'; render(); clearTimeout(ACT._ft); ACT._ft=setTimeout(()=>{ S.ob.flip='awake'; if(S.screen==='ob-flip') render() },2600) },
 'ob-finish':()=>{ S.family=S.family.filter(f=>f.name.trim()); S.place='table'; S.tod='afternoon'; root('home') },
 'view-day':d=>{ S.viewDay=+d.d; render() },
 'seeds-new':()=>{ Object.assign(S.seeds,{dish:'',special:'',noteOpen:false,gen:null,picked:[],fromKitchen:false}); go('seeds-dish') },
 'seeds-from-kitchen':()=>{ Object.assign(S.seeds,{dish:'Rasam and beans poriyal',gen:null,picked:[],fromKitchen:true}); go('seeds-gen') },
 'seeds-edit':()=>{ go('seeds-gen') },
 'seeds-mic':()=>{ S.seeds.listening=true; render(); setTimeout(()=>{S.seeds.listening=false; S.seeds.dish='Rasam and beans poriyal'; if(S.screen==='seeds-dish') render()},1600) },
 'dish-pick':d=>{ S.seeds.dish=d.v; render() },
 'note-open':()=>{ S.seeds.noteOpen=true; render(); setTimeout(()=>document.getElementById('special')?.focus(),30) },
 'dish-next':()=>{ if(!S.seeds.dish.trim()) S.seeds.dish='Rasam and beans poriyal'; S.seeds.gen=null; S.seeds.fromKitchen=false; go('seeds-gen') },
 'who-toggle':d=>{ const w=S.seeds.who; S.seeds.who=w.includes(d.id)?w.filter(x=>x!==d.id):[...w,d.id]; render() },
 regen:()=>{ S.seeds.gen=null; enter('seeds-gen'); render() },
 'seed-heart':d=>{ const i=+d.i,p=S.seeds.picked; S.seeds.picked=p.includes(i)?p.filter(x=>x!==i):[...p,i]; render() },
 plant:()=>{ const g=S.seeds.gen,p=S.seeds.picked; S.seeds.planted={dish:S.seeds.dish,list:p.length?p.map(i=>g[i]):g,who:S.seeds.who.slice()}; S.seeds.fresh=true; setTimeout(()=>{S.seeds.fresh=false},3000);
   toast(S.place==='offline'?'Planted. Annam will get them when it reconnects.':'Seeds planted for tonight'); root('home','back') },
 'open-meal':d=>{ S.mealId=d.id; S.search=false; go('meal') },
 'book-toggle':d=>{ const m=S.meals.find(x=>x.id===d.id); m.book=!m.book; toast(m.book?'Added to the Memory Book':'Removed from the Memory Book'); render() },
 'journal-tab':d=>{ S.jtab=d.k; S.bookPage=0; if(S.screen!=='journal') root('journal'); else { S.dir=null; render(true) } },
 'book-prev':()=>{ S.bookPage=Math.max(0,S.bookPage-1); render() },
 'book-next':()=>{ S.bookPage++; render() },
 'book-who':d=>{ S.bookWho=d.k; S.bookPage=0; render() },
 jfilter:d=>{ S.jFilter=d.k; render() },
 'search-open':()=>{ S.search=true; render(); setTimeout(()=>document.getElementById('q')?.focus(),30) },
 'search-close':()=>{ S.search=false; render() },
 'q-set':d=>{ S.q=d.v; render() },
 'log-start':()=>{ S.log={items:[],who:['priya'],note:'',where:''}; go('log-camera') },
 'item-rm':d=>{ S.log.items.splice(+d.i,1); render() },
 'item-add':()=>{ const i=document.getElementById('additem'); if(i&&i.value.trim()){S.log.items.push(i.value.trim()); render()} },
 logwho:d=>{ const w=S.log.who; S.log.who=w.includes(d.id)?w.filter(x=>x!==d.id):[...w,d.id]; render() },
 'log-save':()=>{ saveLog(); S.screen='log-saved'; S.dir='fade'; render(true) },
 'log-done':()=>{ S.jtab='meals'; root('journal') },

 forget:d=>{ (KNOWS[S.personId]||[]).splice(+d.i,1); toast('Annam has forgotten that'); render() },
 'person-save':()=>{ if(!S.newP.name.trim()) return; const id='p'+Date.now(); TINT[id]='#8C6A5A'; S.family.push({id,name:S.newP.name.trim(),age:S.newP.age||'',role:+S.newP.age>17?'Elder':'Child',call:S.newP.name.trim()}); toast(S.newP.name.trim()+' added'); S.newP={name:'',age:''}; root('family','back') },
 lang:d=>{ const l=S.langs; S.langs=l.includes(d.v)?l.filter(x=>x!==d.v):[...l,d.v]; render() },
 'settings-voice':()=>go('ob-voice'),
 'family-tab':()=>root('family'),
 'restart-week':()=>{ S.firstWeek=true; S.viewDay=S.day; root('home') },
 'restart-ob':()=>{ S.ob.panel=0; S.ob.pair='idle'; S.ob.flip='rest'; S.place='rest'; root('ob-welcome') },
 retry:()=>{ S.place='rest'; toast('Annam is back online'); render() },
 tod:d=>{ S.tod=d.k; if(d.k==='evening'&&S.place==='rest') S.place='table'; if(d.k!=='evening'&&S.place==='table') S.place='rest'; S.dir='fade'; render() },
 place:d=>{ const was=S.place; S.place=d.k; if(d.k!=='dock') S.muted=false;
   if(d.k==='table'&&S.tod!=='evening') S.tod='evening';
   const kitchenOnly=['cook','capture','capture-review'];
   if(d.k!=='dock'&&kitchenOnly.includes(S.screen)){ S.prev=[]; S.screen='home'; }
   if(d.k==='dock'&&was!=='dock') handoff('dock'); else if(was==='dock'&&d.k==='table') handoff('table');
   S.dir='fade'; render() },
 setmute:d=>{ S.muted=d.k==='1'; render() },
 mute:()=>{ S.muted=!S.muted; toast(S.muted?'Muted. Annam isn\'t listening.':'Listening again'); render() },
 fw:d=>{ S.firstWeek=d.k==='1'; S.dir='fade'; render() },
 setday:d=>{ S.day=+d.d; S.viewDay=+d.d; render() },
 fresh:d=>{ S.fresh=d.k==='1'; S.dir='fade'; render() },
 'cap-start':()=>{ if(S.place!=='dock'){ S.place='dock'; handoff('dock'); } S.cap={lines:0,from:'Amma'}; go('capture') },
 'cap-from':d=>{ S.cap.from=d.v; render() },
 'cap-save':()=>{ const c=CAPRECIPE; const nm=(document.getElementById('rname')?.value||c.name).trim(); const from=S.cap.from==='Amma'?'Amma, Priya\'s mother':S.cap.from==='Ajji'?'Ajji, Rohan\'s grandmother':S.cap.from;
   const ex=RECIPES.findIndex(r=>r.id==='r-new'); if(ex>=0) RECIPES.splice(ex,1);
   RECIPES.unshift({id:'r-new',name:nm,from,told:'priya',date:'5 Nov',quote:c.quote,ing:c.ing,steps:c.steps.map(s=>[s,0]),sub:'No lemon? A spoon of grated raw mango does the same job.'});
   S.recipeId='r-new'; S.prev=['home']; S.screen='recipe'; S.dir='fade'; toast('Saved to family recipes'); render(true) },
